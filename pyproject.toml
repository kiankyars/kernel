[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kernel-evolution-arena"
version = "0.1.0"
description = "Correctness-gated Triton evolution for DFlash2 dynamic causal convolution"
requires-python = ">=3.12"
dependencies = ["torch>=2.9", "triton==3.6.0", "numpy==2.2.6"]

[project.optional-dependencies]
validation = ["pytest==8.4.2", "tilelens==3.1.1"]

[project.scripts]
kernel-arena = "arena.__main__:main"

[tool.setuptools.packages.find]
include = ["arena*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

